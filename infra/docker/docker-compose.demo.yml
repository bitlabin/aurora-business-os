# Full evaluation stack: Postgres + Redis + migrations/seed + API + web, built from this checkout.
#
#   docker compose -f infra/docker/docker-compose.demo.yml up --build
#   → open http://localhost:3000 and sign in (see README "Try the demo")
#
#   docker compose -f infra/docker/docker-compose.demo.yml down       # stop, keep data
#   docker compose -f infra/docker/docker-compose.demo.yml down -v    # stop and wipe the database
#
# Credentials below are for the local DEMO only and must never be reused anywhere else.

name: aurora-demo

x-app-image: &app-image
  image: aurora-business-os:demo
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://aurora_app:aurora_app_dev@postgres:5432/aurora
  DATABASE_ADMIN_URL: postgres://aurora_admin:aurora_admin_dev@postgres:5432/aurora
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-demo-only-session-secret-change-me-before-any-real-use}
  # The demo is served over plain http://localhost, so the cookie cannot carry `Secure`.
  SESSION_COOKIE_SECURE: 'false'
  CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: aurora_admin
      POSTGRES_PASSWORD: aurora_admin_dev
      POSTGRES_DB: aurora
    volumes:
      - aurora-demo-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurora_admin -d aurora']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrations as the admin role, then the DEMO dataset (skipped when already present).
  migrate:
    <<: *app-image
    environment: *app-env
    command: ['sh', 'infra/docker/migrate-and-seed.sh']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app-image
    environment:
      <<: *app-env
      API_PORT: 4000
      API_HOST: 0.0.0.0
      # Swagger UI is useful while evaluating; the API disables it in production otherwise.
      OPENAPI_PUBLIC: 'true'
    command: ['node', 'apps/api/dist/main.js']
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app-image
    environment:
      NODE_ENV: production
      # The browser only ever talks to the web origin; Next.js rewrites /api/v1/* to the API.
      API_INTERNAL_URL: http://api:4000
    working_dir: /app/apps/web
    command: ['node_modules/.bin/next', 'start', '-p', '3000', '-H', '0.0.0.0']
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aurora-demo-pgdata:
