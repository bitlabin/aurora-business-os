name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora_admin
          POSTGRES_PASSWORD: aurora_admin_dev
          POSTGRES_DB: aurora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurora_admin -d aurora"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://aurora_admin:aurora_admin_dev@127.0.0.1:5432/aurora
      DATABASE_URL: postgres://aurora_app:aurora_app_dev@127.0.0.1:5432/aurora
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-only-session-secret-ci-only-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create application role
        run: psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres-init/01-roles.sql
      - run: pnpm build --filter=@aurora/types --filter=@aurora/config
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - run: pnpm build

  demo-image:
    name: demo image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the evaluation stack
        run: docker compose -f infra/docker/docker-compose.demo.yml up --build -d --wait --wait-timeout 300
      - name: Migrations and seed completed
        run: |
          docker compose -f infra/docker/docker-compose.demo.yml logs migrate | grep -q 'aurora: database ready'
      - name: Sign in through the web origin
        run: |
          curl -fsS -X POST http://localhost:3000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@northwind.demo","password":"Demo!Pass123"}' | grep -q '"status":"ok"'
      - if: always()
        run: docker compose -f infra/docker/docker-compose.demo.yml down -v
